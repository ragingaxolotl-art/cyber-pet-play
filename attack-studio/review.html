<!doctype html><meta charset="utf-8"><title>Attack tuning review</title><style>body{background:#101820;color:#e8f0f5;font:14px system-ui;margin:16px}header{position:sticky;top:0;background:#101820;padding:10px;z-index:1}button,input{padding:8px;margin-right:8px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article{background:#1a2838;padding:12px;border-radius:8px}canvas{width:100%;background:#0d1520}p{min-height:34px}output{color:#dce993}h2{font-size:16px}</style><header><h1>Attack tuning review · Earth spinning effects</h1><button id="play">Play all</button><button id="reset">Reset</button><label>Frame <input id="frame" type="range" min="0" max="270" value="0"></label><output id="progress">Ready · 0 completed playbacks</output></header><main id="cards"></main><script type="module">
import {shapePoints} from './hitbox-shapes.js';
import {loadExample,drawExample,reviewPose} from './review-example.js';
import {simulate,defaultStats} from './combat-model.js?v=20261024-stun-interrupt';import {visualFrame,pathSample,visualOpacity} from './attack-motion.js?v=20261024-review-support2';
const examples=(await (await fetch('vfx-library.json')).json()).examples;
const rows=await (await fetch('review-batch.json',{cache:'no-store'})).json();let frame=0,playing=false,last=0,elapsed=0,completed=0;
for(const row of rows){row.sim=simulate(row.attack,defaultStats(),defaultStats(),row.options);row.poseReference=examples[row.attack.motion];row.readyReference=examples.ready_side;await loadExample(row.poseReference);await loadExample(row.readyReference);row.zoom=Math.min(1.7,210/(70+Math.max(0,...row.sim.frames.map(f=>-f.target.y))));if(row.effect.sheet){row.image=new Image();row.image.src=row.effect.sheet;await row.image.decode();}else{row.images=await Promise.all(row.effect.frames.map(async src=>{const image=new Image();image.src=src;await image.decode();return image;}));}const article=document.createElement('article');article.innerHTML='<h2></h2><canvas width="480" height="260"></canvas><p></p><output></output>';article.querySelector('h2').textContent=row.attack.name;article.querySelector('p').textContent=row.attack.payload+' · '+row.attack.base+' base · '+row.attack.scaling+' · '+row.attack.cost+' energy';row.canvas=article.querySelector('canvas');row.out=article.querySelector('output');document.querySelector('main').append(article);}
function draw(){for(const r of rows){const c=r.canvas.getContext('2d'),s=r.sim.frames[Math.min(frame,r.sim.frames.length-1)],a=r.attack,v=a.visuals[0],e=r.effect,motionFrame=r.sim.contactMode&&r.sim.impactFrame!==null?Math.min(frame,r.sim.impactFrame):frame,path=pathSample(a,motionFrame);c.clearRect(0,0,480,260);c.save();c.translate(100,230);c.scale(r.zoom,r.zoom);c.imageSmoothingEnabled=false;c.strokeStyle='#526476';c.beginPath();c.moveTo(-50,0);c.lineTo(190,0);c.stroke();c.save();c.translate(0,s.target.y);if(!drawExample(c,r.readyReference,s.target.x,-1,.1)){c.fillStyle='#638eb7';c.fillRect(s.target.x-10,-60,20,60);}c.restore();const fi=visualFrame(e,v,frame,r.sim.impactFrame??Infinity);if(fi>=0){const n=v.frames?.[fi]??fi,[w,h]=e.canvas,[ax,ay]=e.anchor;c.globalAlpha=visualOpacity(e,v,frame,r.sim.impactFrame??Infinity);if(r.images)c.drawImage(r.images[n],v.x+path.x-ax*v.scale,v.y+path.y-ay*v.scale,w*v.scale,h*v.scale);else c.drawImage(r.image,n%e.columns*w,Math.floor(n/e.columns)*h,w,h,v.x+path.x-ax*v.scale,v.y+path.y-ay*v.scale,w*v.scale,h*v.scale);c.globalAlpha=1;}reviewPose(c,r,frame);if(s.self.shield){c.strokeStyle='#bce8a6';c.strokeRect(-13,-64,26,68);}if(s.self.evading){c.strokeStyle='#d9faff';c.setLineDash([2,2]);c.strokeRect(-15,-64,30,66);c.setLineDash([]);}c.strokeStyle=s.active?'#ffb74e':'#756548';c.beginPath();if(s.box.shape==='ellipse'){c.ellipse(s.box.x+s.box.w/2,s.box.y+s.box.h/2,s.box.w/2,s.box.h/2,0,0,Math.PI*2);}else{const points=shapePoints(s.box);points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();}c.stroke();c.strokeStyle='#78bbff';c.strokeRect(s.targetBox.x,s.targetBox.y,s.targetBox.w,s.targetBox.h);c.restore();r.out.textContent=r.sim.events.filter(e=>e.frame<=frame).map(e=>e.frame+'f '+e.text).join(' · ')||'Waiting';}document.querySelector('#frame').value=frame;document.querySelector('#progress').textContent='Frame '+frame+' · '+completed+' completed playbacks';}
document.querySelector('#play').onclick=()=>{frame=0;playing=true;elapsed=0;};document.querySelector('#reset').onclick=()=>{playing=false;frame=0;draw();};document.querySelector('#frame').oninput=e=>{playing=false;frame=+e.target.value;draw();};function tick(now){if(playing){elapsed+=Math.min((now-last)/1000,.1)*60;while(elapsed>=1){elapsed--;frame++;if(frame>=270){playing=false;completed++;break;}}draw();}last=now;requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);
</script>
