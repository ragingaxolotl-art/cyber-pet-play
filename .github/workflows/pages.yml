name: Publish Cyber Pet
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Historical binary chunks remain in Git and load from pinned revisions.
          sparse-checkout: |
            /*
            !/chunks/
          sparse-checkout-cone-mode: false
      - name: Build and verify site
        run: |
          python3 scripts/build-pages.py "$RUNNER_TEMP/cyber-pet-pages" > "$RUNNER_TEMP/pages-build.json"
          python3 scripts/verify-pages.py "$RUNNER_TEMP/cyber-pet-pages"
          cat "$RUNNER_TEMP/pages-build.json"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/cyber-pet-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The prior deployment built successfully but exceeded the default sync wait.
          timeout: 1200000
