<script>// Lossless browser delivery. Only this cache contains public game assets;
// pet saves, accounts and classroom publications are never read or evicted here.

  const nativeFetch = window.fetch.bind(window);
  const CACHE = 'cpp-verified-game-assets-v1';
  const LIMIT = 128 * 1024 * 1024;
  const pending = new Map();
  const hex = bytes => Array.from(new Uint8Array(bytes), n => n.toString(16).padStart(2, '0')).join('');
  const hash = async bytes => hex(await crypto.subtle.digest('SHA-256', bytes));

  let cacheWrites = Promise.resolve();
  async function metadata() {
    if (!metadataPromise) metadataPromise = (async () => {
      const response = await nativeFetch("https://raw.githubusercontent.com/ragingaxolotl-art/cyber-pet-play/ba8fe4071e92e9363e9e627fdbbead0692a24978/manifests/d6763566bc51cfab61f4915b9e785212fa30cce049345df780f20b42f0b8dde0.json");
      if (!response.ok) throw Error('Game download details are unavailable. Please refresh.');
      const bytes = await response.arrayBuffer();
      if (await hash(bytes) !== "d6763566bc51cfab61f4915b9e785212fa30cce049345df780f20b42f0b8dde0") throw Error('Game download details failed verification.');
      const value = JSON.parse(new TextDecoder().decode(bytes));
      window.cppAssetBaseUrl = value.base;
      return value;
    })().catch(error => { metadataPromise = null; throw error; });
    return metadataPromise;
  }
  async function checked(bytes, digest, size) {
    if (bytes.byteLength !== size || await hash(bytes) !== digest) throw Error('Game download failed verification. Please retry.');
    return bytes;
  }
  async function fetchBytes(base, digest, size) {
    const key = new URL('_verified-assets/'+digest, location.origin+'/cyber-pet-play/').href;
    let cache;
    try {
      cache = await caches.open(CACHE);
      const saved = await cache.match(key);
      if (saved) {
        try { return await checked(await saved.arrayBuffer(),digest,size); }
        catch { await cache.delete(key); }
      }
    } catch { cache = null; } // Private browsing/storage refusal must not prevent play.
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(),40000);
    let bytes;
    try {
      const response = await nativeFetch(base+digest+'.bin',{signal:controller.signal});
      if (!response.ok) throw Error('Game download interrupted. Please retry.');
      bytes = await checked(await response.arrayBuffer(),digest,size);
    } finally { clearTimeout(timer); }
    if (cache) {
      cacheWrites = cacheWrites.then(async () => {
      try {
        // Insertion order provides bounded FIFO eviction. Only our asset cache
        // is touched, and deleting an entry cannot delete a pet's saved data.
        const keys = await cache.keys(); let total = 0; const sizes = [];
        for (const request of keys) {
          const response = await cache.match(request);
          const count = Number(response?.headers.get('Content-Length')) || 0;

      } catch { /* Quota/cache failures fall back to verified network bytes. */ }
      });

  }

    if (!pending.has(item.sha256)) pending.set(item.sha256,(async () => {
      const gzip = item.encoding === 'gzip' && typeof DecompressionStream !== 'undefined';
      const digest = item.encoding === 'gzip' && !gzip ? item.fallback : item.encoded_sha256;
      const size = item.encoding === 'gzip' && !gzip ? item.size : item.encoded_size;
      let bytes = await fetchBytes(base,digest,size);
      if (gzip) bytes = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();

    })().finally(() => pending.delete(item.sha256)));

  }

  // manifest containing startup/background lists must not trigger predownloads.
  window.cppStartupPrepared = false;
  window.fetch = async (input, options) => {
    const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, document.baseURI);
    // Limit interception to Godot pack/engine requests and our pinned asset root.
    const name = ['index.pck','index.wasm'].find(name => url.href === new URL(name,document.baseURI).href);
    const looksOptional = /\/[a-f0-9]{64}\.bin$/.test(url.pathname);
    if (!name && !looksOptional) return nativeFetch(input,options);

    const digest = url.pathname.split('/').pop().replace('.bin','');
    const item = name ? meta.assets[name] : (url.href === meta.base+digest+'.bin' ? meta.deliveries[digest] : null);

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9235652,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
const statusOverlay = document.getElementById('status');
const statusProgress = document.getElementById('status-progress');
const statusNotice = document.getElementById('status-notice');

let initializing = true;
let statusMode = '';

function setStatusMode(mode) {
if (statusMode === mode || !initializing) {
return;
}
if (mode === 'hidden') {
statusOverlay.remove();
initializing = false;
return;
}
statusOverlay.style.visibility = 'visible';
statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
statusMode = mode;
}

function setStatusNotice(text) {
while (statusNotice.lastChild) {
statusNotice.removeChild(statusNotice.lastChild);
}
const lines = text.split('\n');
lines.forEach((line) => {
statusNotice.appendChild(document.createTextNode(line));
statusNotice.appendChild(document.createElement('br'));
});
}

function displayFailureNotice(err) {
console.error(err);
if (err instanceof Error) {
setStatusNotice(err.message);
} else if (typeof err === 'string') {
setStatusNotice(err);
} else {
setStatusNotice('An unknown error occurred.');
}
setStatusMode('notice');
initializing = false;
}

const missing = Engine.getMissingFeatures({
threads: GODOT_THREADS_ENABLED,
});

if (missing.length !== 0) {
if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
let serviceWorkerRegistrationPromise;
try {
serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
} catch (err) {
serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
}
// There's a chance that installing the service worker would fix the issue
Promise.race([
serviceWorkerRegistrationPromise.then((registration) => {
if (registration != null) {
return Promise.reject(new Error('Service worker already exists.'));
}
return registration;
}).then(() => engine.installServiceWorker()),
// For some reason, `getRegistration()` can stall
new Promise((resolve) => {
setTimeout(() => resolve(), 2000);
}),
]).then(() => {
// Reload if there was no error.
window.location.reload();
}).catch((err) => {
console.error('Error while registering service worker:', err);
});
} else {
// Display the message as usual
const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
displayFailureNotice(missingMsg + missing.join('\n'));
}
} else {
setStatusMode('progress');
engine.startGame({
'onProgress': function (current, total) {
if (current > 0 && total > 0) {
statusProgress.value = current;
statusProgress.max = total;
} else {
statusProgress.removeAttribute('value');
statusProgress.removeAttribute('max');
}
},
}).then(() => {
setStatusMode('hidden');
}, displayFailureNotice);
}
}());
</script>
